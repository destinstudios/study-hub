<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Dashboard | DestiQora</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<header class="navbar glass">
  <a href="./index.html" class="brand">
    <span class="brand-icon">D</span>
    <span><strong>DestiQora</strong><small>STUDY HUB</small></span>
  </a>
  <a href="./study.html" class="btn btn-glass">Study Zone</a>
  <button id="logoutBtn" class="btn btn-primary">Sign out</button>
</header>

<main class="container section">

  <div class="glass" style="padding:30px;border-radius:22px">
    <span class="eyebrow">YOUR PERSONAL SPACE</span>
    <h1 id="welcome">Welcome, Student!</h1>
    <p id="userEmail" style="color:var(--muted);margin-top:10px"></p>
    <p id="userUid" style="color:var(--muted);font-size:11px;margin-top:10px"></p>
    <img id="userPhoto" alt="Profile photo"
      style="width:65px;height:65px;border-radius:50%;margin-top:20px;object-fit:cover">
  </div>

  <section class="section">
    <h2>Quick access</h2>
    <div class="category-grid" style="margin-top:20px">
      <a href="./study.html" class="category-card glass">
        📚<h3>Study Materials</h3>
        <p>Browse all published resources.</p>
      </a>
      <a href="./quiz.html" class="category-card glass">
        🧠<h3>Practice Quiz</h3>
        <p>Test your knowledge.</p>
      </a>
      <a href="./tools.html" class="category-card glass">
        🛠️<h3>Online Tools</h3>
        <p>Explore useful utilities.</p>
      </a>
    </div>
  </section>

  <section class="section">
    <h2>My favourites</h2>
    <div id="myFavorites" class="resource-grid" style="margin-top:20px">
      <div class="loading-card glass">Loading favourites...</div>
    </div>
  </section>

  <a id="adminLink" class="btn btn-primary hidden"
    href="./admin.html">Open Admin Studio →</a>
</main>

<script type="module" src="./js/dashboard.js"></script>
</body>
</html>
