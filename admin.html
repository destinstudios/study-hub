<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Studio | DestiQora</title>
<link rel="stylesheet" href="./css/styles.css">
<link rel="stylesheet" href="./css/admin.css">
</head>
<body>

<header class="navbar glass">
  <a href="./index.html" class="brand">
    <span class="brand-icon">D</span>
    <span><strong>DestiQora</strong><small>ADMIN STUDIO</small></span>
  </a>
  <a href="./dashboard.html" class="btn btn-glass">Student View</a>
  <button id="adminLogout" class="btn btn-primary">Sign out</button>
</header>

<main class="container section">
  <span class="eyebrow">CONTROL CENTER</span>
  <h1>Admin Studio</h1>
  <p style="color:var(--muted);margin:10px 0 25px">
    Manage study resources and announcements.
  </p>

  <div class="stats-grid">
    <div class="stat-card glass">
      <span>📚</span><strong id="totalResources">0</strong>
      <small>Total resources</small>
    </div>
    <div class="stat-card glass">
      <span>👥</span><strong id="totalUsers">—</strong>
      <small>Registered users</small>
    </div>
    <div class="stat-card glass">
      <span>📢</span><strong id="totalNotices">0</strong>
      <small>Announcements</small>
    </div>
    <div class="stat-card glass">
      <span>☁️</span><strong>Supabase</strong>
      <small>File storage</small>
    </div>
  </div>

  <section class="section glass admin-panel">
    <h2>Upload study material</h2>

    <form id="uploadForm" class="admin-form">
      <label>Resource title
        <input name="title" required maxlength="150">
      </label>

      <label>Description
        <textarea name="description" maxlength="1000"></textarea>
      </label>

      <label>Subject
        <select name="subject" required>
          <option value="">Select subject</option>
          <option>Mathematics</option>
          <option>Applied Chemistry</option>
          <option>Physics</option>
          <option>Communication Skills</option>
          <option>Programming</option>
          <option>Computer Science Engineering</option>
          <option>Other Subjects</option>
        </select>
      </label>

      <label>Semester
        <select name="semester" required>
          <option value="">Select semester</option>
          <option>1st Semester</option>
          <option>2nd Semester</option>
          <option>3rd Semester</option>
          <option>4th Semester</option>
          <option>5th Semester</option>
          <option>6th Semester</option>
          <option>All Semesters</option>
        </select>
      </label>

      <label>Choose file
        <input type="file" name="file" required
          accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png,.webp">
      </label>

      <label class="check-row">
        <input type="checkbox" name="published">
        Publish immediately
      </label>

      <button class="btn btn-primary" type="submit">
        Upload Material
      </button>

      <progress id="uploadProgress" value="0" max="100"></progress>
      <p id="uploadStatus"></p>
    </form>
  </section>

  <section class="section glass admin-panel">
    <h2>Manage resources</h2>
    <div id="adminResources">Loading...</div>
  </section>

  <section class="section glass admin-panel">
    <h2>Publish announcement</h2>

    <form id="noticeForm" class="admin-form">
      <label>Notice title
        <input name="title" required maxlength="150">
      </label>

      <label>Message
        <textarea name="body" required maxlength="2000"></textarea>
      </label>

      <label class="check-row">
        <input type="checkbox" name="published" checked>
        Publish notice
      </label>

      <button class="btn btn-primary">Publish announcement</button>
    </form>

    <div id="adminNotices" style="margin-top:20px"></div>
  </section>
</main>

<script type="module" src="./js/admin.js"></script>
</body>
</html>
